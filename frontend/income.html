<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income - Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Dynamic Sidebar Container -->
        <div id="sidebar-container"></div>
        
        <!-- Main Panel -->
        <main class="main-content">
            <header class="header-bar">
                <div class="welcome-section">
                    <h1>Income Management</h1>
                    <p>Track your earnings and revenue streams</p>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle-btn" id="dark-theme-toggle" title="Toggle Theme">
                        <svg style="width: 1.25rem; height: 1.25rem;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </button>
                    <button class="btn btn-primary" id="open-add-modal-btn">
                        <!-- Plus SVG Icon -->
                        <svg style="width: 1.125rem; height: 1.125rem;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Add Income
                    </button>
                </div>
            </header>

            <!-- Income Card -->
            <section class="card table-card">
                <div class="card-title-bar" style="margin-bottom: 0.5rem;">
                    <h2>Income Records</h2>
                    <button class="btn btn-secondary btn-sm" id="export-csv-btn">
                        <svg style="width: 0.875rem; height: 0.875rem;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Export CSV
                    </button>
                </div>
                
                <!-- Filters panel -->
                <div class="filters-panel" style="display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; padding: 0.75rem; background-color: var(--background); border-radius: var(--radius-md); border: 1px solid var(--border);">
                    <div style="flex-grow: 1; min-width: 200px;">
                        <input type="text" id="search-input" class="form-control" style="padding: 0.5rem 0.75rem; font-size: 0.875rem;" placeholder="Search by description or source...">
                    </div>
                </div>
                
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th id="sort-date" style="cursor: pointer; user-select: none; white-space: nowrap;">Date <span class="sort-indicator">↕</span></th>
                                <th id="sort-desc" style="cursor: pointer; user-select: none; white-space: nowrap;">Description <span class="sort-indicator">↕</span></th>
                                <th id="sort-source" style="cursor: pointer; user-select: none; white-space: nowrap;">Source <span class="sort-indicator">↕</span></th>
                                <th id="sort-amount" style="cursor: pointer; user-select: none; white-space: nowrap;">Amount <span class="sort-indicator">↕</span></th>
                                <th style="text-align: right; user-select: none;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="income-table-body">
                            <tr>
                                <td colspan="5" style="text-align: center; color: var(--text-secondary); padding: 2rem;">
                                    Loading income records...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination Footer -->
                <div class="pagination-footer" style="display: flex; justify-content: space-between; align-items: center; padding-top: 1rem; border-top: 1px solid var(--border); margin-top: 0.5rem; flex-wrap: wrap; gap: 0.5rem;">
                    <div id="pagination-info" style="font-size: 0.825rem; color: var(--text-secondary);">
                        Showing 0 to 0 of 0 entries
                    </div>
                    <div style="display: flex; gap: 0.35rem;">
                        <button class="btn btn-secondary btn-sm" id="prev-page-btn" style="padding: 0.35rem 0.65rem;">Previous</button>
                        <button class="btn btn-secondary btn-sm" id="next-page-btn" style="padding: 0.35rem 0.65rem;">Next</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="income-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Add New Income</h3>
                <button class="modal-close-btn" id="close-modal-btn">
                    <!-- Close SVG Icon -->
                    <svg style="width: 1.25rem; height: 1.25rem;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            
            <form id="income-form">
                <input type="hidden" id="income-id">
                
                <div class="form-group">
                    <label for="income-amount">Amount (₹)</label>
                    <input type="number" step="0.01" min="0.01" id="income-amount" class="form-control" placeholder="0.00" required>
                </div>
                
                <div class="form-group">
                    <label for="income-source">Source</label>
                    <input type="text" id="income-source" class="form-control" placeholder="Salary, Freelance, Investment, etc." required>
                </div>

                <div class="form-group">
                    <label for="income-date">Date</label>
                    <input type="date" id="income-date" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="income-description">Description</label>
                    <textarea id="income-description" class="form-control" rows="3" placeholder="Additional details..."></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-modal-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="save-btn">Save Income</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/income.js"></script>
</body>
</html>
