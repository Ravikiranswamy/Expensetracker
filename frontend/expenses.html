<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses - Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Dynamic Sidebar Container -->
        <div id="sidebar-container"></div>
        
        <!-- Main Panel -->
        <main class="main-content">
            <header class="header-bar">
                <div class="welcome-section">
                    <h1>Expense Management</h1>
                    <p>Track your spending habits and categorizations</p>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle-btn" id="dark-theme-toggle" title="Toggle Theme">
                        <svg style="width: 1.25rem; height: 1.25rem;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </button>
                    <button class="btn btn-primary" id="open-add-modal-btn">
                        <!-- Plus SVG Icon -->
                        <svg style="width: 1.125rem; height: 1.125rem;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Add Expense
                    </button>
                </div>
            </header>

            <!-- Expenses Card -->
            <section class="card table-card">
                <div class="card-title-bar" style="margin-bottom: 0.5rem;">
                    <h2>Expense Records</h2>
                    <button class="btn btn-secondary btn-sm" id="export-csv-btn">
                        <svg style="width: 0.875rem; height: 0.875rem;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Export CSV
                    </button>
                </div>
                
                <!-- Filters panel -->
                <div class="filters-panel" style="display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; padding: 0.75rem; background-color: var(--background); border-radius: var(--radius-md); border: 1px solid var(--border);">
                    <div style="flex-grow: 1; min-width: 200px;">
                        <input type="text" id="search-input" class="form-control" style="padding: 0.5rem 0.75rem; font-size: 0.875rem;" placeholder="Search by description...">
                    </div>
                    <div style="width: 160px;">
                        <select id="filter-category" class="form-control" style="padding: 0.5rem 0.75rem; font-size: 0.875rem;">
                            <option value="">All Categories</option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Health">Health</option>
                            <option value="Education">Education</option>
                            <option value="Investment">Investment</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>
                    <div style="width: 160px;">
                        <select id="filter-payment" class="form-control" style="padding: 0.5rem 0.75rem; font-size: 0.875rem;">
                            <option value="">All Payment Methods</option>
                            <option value="Cash">Cash</option>
                            <option value="Credit Card">Credit Card</option>
                            <option value="Debit Card">Debit Card</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="Mobile Wallet">Mobile Wallet</option>
                        </select>
                    </div>
                </div>
                
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th id="sort-date" style="cursor: pointer; user-select: none; white-space: nowrap;">Date <span class="sort-indicator">↕</span></th>
                                <th id="sort-desc" style="cursor: pointer; user-select: none; white-space: nowrap;">Description <span class="sort-indicator">↕</span></th>
                                <th id="sort-category" style="cursor: pointer; user-select: none; white-space: nowrap;">Category <span class="sort-indicator">↕</span></th>
                                <th id="sort-payment" style="cursor: pointer; user-select: none; white-space: nowrap;">Payment Method <span class="sort-indicator">↕</span></th>
                                <th id="sort-amount" style="cursor: pointer; user-select: none; white-space: nowrap;">Amount <span class="sort-indicator">↕</span></th>
                                <th style="text-align: right; user-select: none;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="expenses-table-body">
                            <tr>
                                <td colspan="6" style="text-align: center; color: var(--text-secondary); padding: 2rem;">
                                    Loading expenses...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination Footer -->
                <div class="pagination-footer" style="display: flex; justify-content: space-between; align-items: center; padding-top: 1rem; border-top: 1px solid var(--border); margin-top: 0.5rem; flex-wrap: wrap; gap: 0.5rem;">
                    <div id="pagination-info" style="font-size: 0.825rem; color: var(--text-secondary);">
                        Showing 0 to 0 of 0 entries
                    </div>
                    <div style="display: flex; gap: 0.35rem;">
                        <button class="btn btn-secondary btn-sm" id="prev-page-btn" style="padding: 0.35rem 0.65rem;">Previous</button>
                        <button class="btn btn-secondary btn-sm" id="next-page-btn" style="padding: 0.35rem 0.65rem;">Next</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="expense-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Add New Expense</h3>
                <button class="modal-close-btn" id="close-modal-btn">
                    <!-- Close SVG Icon -->
                    <svg style="width: 1.25rem; height: 1.25rem;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            
            <form id="expense-form">
                <input type="hidden" id="expense-id">
                
                <div class="form-group">
                    <label for="expense-amount">Amount (₹)</label>
                    <input type="number" step="0.01" min="0.01" id="expense-amount" class="form-control" placeholder="0.00" required>
                </div>
                
                <div class="form-group">
                    <label for="expense-category">Category</label>
                    <select id="expense-category" class="form-control" required>
                        <option value="" disabled selected>Select category</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health</option>
                        <option value="Education">Education</option>
                        <option value="Investment">Investment</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="expense-payment-method">Payment Method</label>
                    <select id="expense-payment-method" class="form-control" required>
                        <option value="" disabled selected>Select method</option>
                        <option value="Cash">Cash</option>
                        <option value="Credit Card">Credit Card</option>
                        <option value="Debit Card">Debit Card</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="Mobile Wallet">Mobile Wallet</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="expense-date">Date</label>
                    <input type="date" id="expense-date" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="expense-description">Description</label>
                    <textarea id="expense-description" class="form-control" rows="3" placeholder="Additional details..."></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-modal-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="save-btn">Save Expense</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/expenses.js"></script>
</body>
</html>
