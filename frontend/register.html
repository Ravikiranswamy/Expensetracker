<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">ET</div>
                <h1>Create an Account</h1>
                <p>Start tracking your personal finances today</p>
            </div>
            
            <div id="error-message" class="auth-error"></div>
            
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Min. 6 characters" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem; width: 100%;">Sign Up</button>
            </form>
            
            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Direct auth check - if already logged in, auth.js redirect takes care of it
        checkAuth();

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            
            errorDiv.style.display = 'none';
            
            try {
                const response = await api.post('/auth/register', { name, email, password });
                
                // Store JWT token and User Details
                localStorage.setItem('token', response.token);
                localStorage.setItem('user', JSON.stringify({
                    id: response.id,
                    name: response.name,
                    email: response.email,
                    monthlyBudget: response.monthlyBudget
                }));
                
                showToast('Registration successful! Redirecting...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } catch (err) {
                errorDiv.innerText = err.message || 'Registration failed. Please check your inputs.';
                errorDiv.style.display = 'block';
                showToast(err.message || 'Registration failed', 'error');
            }
        });
    </script>
</body>
</html>
